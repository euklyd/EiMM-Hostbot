[project]
name = "eimm-hostbot"
version = "0.1.0"
description = "EiMM hostbot for eimm things"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "discord.py[voice]>=2.3.0",
    "fuzzywuzzy>=0.18.0",
    "dice>=3.1.2",
    "gspread>=5.2.0",
    "imgurpython>=1.1.7",
    "munkres>=1.1.4",
    "oauth2client>=4.1.3",
    "Pillow>=10.0.0",
    "python-Levenshtein>=0.12.2",
    "pytz>=2021.3",
    "SQLAlchemy>=2.0.0",
    "aiosqlite>=0.17.0",
    "asyncpg>=0.29.0",
    "aiohttp>=3.9.0",
    "alembic>=1.13.0",
    # Web interface (Phase 8.6)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
]

[project.scripts]
bidoof = "bidoof:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cogs", "core", "utils", "schemas", "conf", "db", "web"]
include = ["bidoof.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async (important for discord.py)
    "ANN001", # missing type annotations for function arguments
    "ANN201", # missing return type for public functions
    "ANN202", # missing return type for private functions
    "ANN205", # missing return type for static methods
]
ignore = [
    "E501",     # line length handled by formatter
    "B005",     # strip() with multi-char - intentional for markdown code blocks
    "ASYNC109", # timeout parameter naming - acceptable
    "ASYNC210", # blocking HTTP - will fix during interview overhaul
    "ASYNC230", # blocking file I/O - will fix during interview overhaul
]

[tool.ruff.lint.per-file-ignores]
# interview.py will be overhauled in Phase 8 - defer annotations until then
"cogs/interview.py" = ["ANN"]
# Type annotations on test functions/fixtures add noise without value
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Ignore missing conf/settings.py (gitignored user config)
ignore = ["conf/settings.py"]
# Lenient settings for legacy code - will tighten during discord.py v2 migration
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
reportOptionalMemberAccess = "warning"
reportArgumentType = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
reportAttributeAccessIssue = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalSubscript = "warning"
reportUnusedCoroutine = "error"  # Keep this as error - important for async code

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
