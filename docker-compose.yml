services:
  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection for the app
      - DATABASE_URL=postgresql+asyncpg://eimm:${DB_PASSWORD}@postgres:5432/eimm
      # Backup settings
      - BACKUP_RETENTION_DAYS=7
      # PostgreSQL client auth for pg_dump
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - ./conf:/app/conf:ro  # Bot config (includes token)
      - ./databases:/app/databases  # SQLite databases
      - ./backups:/app/backups  # Pre-migration backups (bind mount)
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=eimm
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=eimm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose for local dev tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eimm -d eimm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
