services:
  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # Database connection for the app
      - DATABASE_URL=postgresql+asyncpg://eimm:${DB_PASSWORD}@postgres:5432/eimm
      # Legacy env vars (can remove after full migration)
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=eimm
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=eimm
      # Backup settings
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=7
    volumes:
      - ./conf:/app/conf:ro
      - ./databases:/app/databases  # For SQLite compatibility during migration
      - backups:/backups
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=eimm
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=eimm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose for local dev tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eimm -d eimm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  backups:
